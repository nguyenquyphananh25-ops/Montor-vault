    <style>
      body {

      /* Strict Vietnamese Administrative Formatting Rules (Nghị định 30/2020/NĐ-CP & Standard Formats) */
      .vn-admin-document {
        font-family: "Times New Roman", Times, Georgia, serif !important;
        line-height: 1.25;
        color: #000000;
        background-color: #ffffff;
      }

      .vn-admin-document h1,
      .vn-admin-document h2,
      .vn-admin-document h3,
      .vn-admin-document p,
      .vn-admin-document span,

      .vn-admin-document table,

      }

      .vn-admin-document p {
        margin-bottom: 4pt;
      }

      .vn-admin-document table {
        border-collapse: collapse;
        width: 100%;

      .vn-admin-document th,

      /* A4 Page Layout & Exact Administrative Margins: Top: 20mm, Right: 15mm, Bottom: 20mm, Left: 30mm */
      @page {
        size: A4 portrait;
        margin: 20mm 15mm 20mm 30mm; /* Top: 20mm, Right: 15mm, Bottom: 20mm, Left: 30mm */
      }

      @media print {
        html, body, #root {
          background: #ffffff !important;
          color: #000000 !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Automatically strip the web UI: header, sidebar, toolbars, buttons, inputs, backdrops */
        header, nav, aside, footer, button, input, .no-print, .modal-backdrop-print-hide {
          display: none !important;
        }

        /* Clean unconstrained display for modals when printing */
        .fixed.inset-0 {
          position: static !important;
          background: transparent !important;
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
          height: auto !important;
          max-height: none !important;
          overflow: visible !important;
          display: block !important;
        }

        .max-w-4xl, .max-w-3xl, .max-w-2xl, .max-w-5xl, .max-w-lg {
          max-width: 100% !important;
          width: 100% !important;
          border: none !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          background: transparent !important;
        }

        .print-only {
          display: inline-block !important;
        }

        .vn-admin-document, .print-page {
          box-shadow: none !important;
          border: none !important;
          width: 100% !important;
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
          background: #ffffff !important;
          page-break-inside: auto;
        }

        .page-break-before {
          page-break-before: always !important;
          break-before: page !important;
        }

        .avoid-break {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        tr {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
